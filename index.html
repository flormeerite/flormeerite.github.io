<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#160A1A">
<title>ohhwea</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Oswald:wght@500;600&family=Pirata+One&family=PT+Mono&display=swap">
<style>
:root{
  --bg:#160A1A;            /* тёмно-сливовый */
  --bg-hi:#2E1336;
  --ivory:#EFE6CC;         /* слоновая кость */
  --ivory-dim:#A99FA9;
  --pumpkin:#FF7A1A;       /* тыква */
  --green:#8CE82F;         /* ядовито-зелёный */
  --blood:#B3243A;         /* логотип */
  --wood:#2A170F;
  --paper-ink:#24160F;
  --paper-red:#7C1628;
  --line:rgba(239,230,204,.14);
  --f-head:'Oswald','Arial Narrow',system-ui,sans-serif;
  --f-logo:'Pirata One',Georgia,serif;
  --f-text:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-type:'PT Mono','Courier New',monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ivory);
  font:400 15px/1.4 var(--f-text);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left;touch-action:manipulation}
:focus-visible{outline:2px solid var(--green);outline-offset:3px}

/* зерно плёнки поверх всего */
body::after{content:'';position:fixed;inset:0;z-index:100;pointer-events:none;background-image:var(--grain-film);opacity:.5}

/* ---------- страницы ---------- */
.page{position:fixed;inset:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--bg)}
.wood{background:
  radial-gradient(130% 55% at 50% 0%,rgba(0,0,0,.6),transparent 72%),
  repeating-linear-gradient(90deg,transparent 0 95px,rgba(0,0,0,.55) 95px 97px,rgba(255,200,150,.04) 97px 98px),
  var(--grain-wood),var(--wood)}

/* главная */
.home{z-index:1;padding:calc(34px + var(--safe-t)) 18px calc(28px + var(--safe-b));
  background:radial-gradient(110% 45% at 12% 0%,var(--bg-hi),transparent 70%),var(--bg);
  transition:transform .45s var(--ease)}
.home.shift{transform:translateX(-14%)}
.web{position:absolute;top:0;right:0;width:176px;height:176px;opacity:.2;transform:scaleX(-1);pointer-events:none}
.logo{position:relative;font:400 84px/.9 var(--f-logo);color:var(--blood);
  text-shadow:0 0 24px rgba(179,36,58,.55);animation:flicker 1.8s .15s both}
@keyframes flicker{
  0%{opacity:0}8%{opacity:.9}12%{opacity:.2}16%{opacity:1}30%{opacity:.45}34%{opacity:1}60%{opacity:.75}64%{opacity:1}100%{opacity:1}
}
.home .sub{position:relative;margin-top:10px;color:var(--ivory-dim)}
.rows{position:relative;margin-top:30px;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;
  padding:16px 0;border-bottom:1px solid var(--line)}
.row-name{display:flex;flex-direction:column;gap:1px;font:600 40px/.98 var(--f-head);color:var(--ivory);
  transition:color .2s var(--ease),transform .25s var(--ease)}
.row:active .row-name{color:var(--pumpkin);transform:translateX(6px)}
.row-count{display:block;margin-top:10px;font-size:13px;color:var(--green)}
.row svg{width:74px;height:74px;flex:none;filter:drop-shadow(0 0 6px rgba(239,230,204,.3));transition:transform .3s var(--ease)}
.row:active svg{transform:rotate(-6deg) scale(1.06)}

/* категория */
.cat{z-index:2;transform:translateX(100%);visibility:hidden;transition:transform .45s var(--ease),visibility 0s .45s}
.cat.open{transform:none;visibility:visible;transition:transform .45s var(--ease)}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;height:52px;padding:var(--safe-t) 6px 0}
.back{display:grid;place-items:center;width:44px;height:44px;border-radius:50%}
.back:active{background:rgba(239,230,204,.14)}
.tg .bar{display:none}
.cat-head{padding:calc(12px + var(--safe-t)) 18px 24px}
.bar + .cat-head{padding-top:6px}
.tg .cat-head{padding-top:calc(16px + var(--safe-t))}
.cat-title{display:flex;flex-direction:column;gap:1px;font:600 56px/.96 var(--f-head);color:var(--ivory)}
.cat-count{margin-top:12px;color:var(--green)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px 14px;padding:6px 18px calc(36px + var(--safe-b))}
.empty{grid-column:1/-1;padding:24px 0;color:var(--ivory-dim)}

/* плашка вещи: тёмная плитка на гвозде */
.card{--r:0deg;display:block;width:100%;transform:rotate(var(--r));transform-origin:50% 10px;
  transition:transform .2s var(--ease);
  animation:nailed .6s var(--ease) backwards;animation-delay:calc(var(--i,0)*70ms + 160ms)}
.card:active{transform:rotate(var(--r)) scale(.96)}
@keyframes nailed{
  0%{opacity:0;transform:translateY(-22px) rotate(calc(var(--r) - 7deg)) scale(1.06)}
  50%{opacity:1;transform:translateY(0) rotate(calc(var(--r) + 2.4deg)) scale(1)}
  75%{transform:rotate(calc(var(--r) - 1deg))}
  100%{transform:rotate(var(--r))}
}
.art{position:relative;aspect-ratio:4/5;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(90% 70% at 50% 42%,#40204A 0,#26122D 55%,#190B1F 100%);
  border:1px solid rgba(239,230,204,.13);border-radius:8px;box-shadow:0 12px 20px rgba(0,0,0,.5)}
.art svg{width:78%;height:auto;filter:drop-shadow(0 0 8px rgba(239,230,204,.28))}
.art img{width:100%;height:100%;object-fit:cover}
.nail,.art::before{width:14px;height:14px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#eadcb8 0 12%,#a07f48 38%,#4d371a 72%,#241808);
  box-shadow:0 2px 3px rgba(0,0,0,.65),0 0 0 1px rgba(0,0,0,.55)}
.art::before{content:'';position:absolute;top:9px;left:50%;margin-left:-7px;z-index:1}
.meta{display:block;padding:12px 2px 0}
.name{display:-webkit-box;line-clamp:2;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:500;line-height:1.25}
.price{display:block;margin-top:6px;font-weight:600;color:var(--pumpkin);font-variant-numeric:tabular-nums}

/* страница вещи */
.item{z-index:3;transform:translateY(100%);visibility:hidden;transition:transform .5s var(--ease),visibility 0s .5s}
.item.open{transform:none;visibility:visible;transition:transform .5s var(--ease)}
.item.instant,.item.instant.open{transition:none}
.hero{margin:calc(12px + var(--safe-t)) 18px 0}
.bar + .hero{margin-top:0}
.tg .hero{margin-top:calc(12px + var(--safe-t))}
.i-head{padding:22px 18px 0}
.i-name{font:600 32px/1.05 var(--f-head);color:var(--ivory)}
.i-price{margin-top:10px;font:600 26px/1 var(--f-text);color:var(--pumpkin);font-variant-numeric:tabular-nums}

/* паспорт: бумага, прибитая гвоздём к дереву */
.pinwrap{--tilt:-1.3deg;position:relative;margin:30px 18px 14px;transform-origin:50% 16px;
  transform:rotate(var(--tilt));opacity:0;filter:drop-shadow(0 14px 12px rgba(0,0,0,.6))}
.pinwrap.in{animation:drop 1.9s ease-in-out both}
@keyframes drop{
  0%{opacity:0;transform:translateY(-38px) rotate(-8deg) scale(1.06)}
  30%{opacity:1;transform:translateY(0) rotate(3.4deg) scale(1)}
  52%{transform:rotate(-2.4deg)}
  72%{transform:rotate(1.2deg)}
  100%{opacity:1;transform:rotate(var(--tilt))}
}
.pinwrap .nail{position:absolute;top:11px;left:50%;margin-left:-7px;z-index:3}
.pinwrap.in .nail{animation:thump .9s ease-out .38s backwards}
@keyframes thump{0%{transform:scale(2.6);opacity:0}30%{opacity:1}55%{transform:scale(.82)}100%{transform:scale(1)}}
.paper{position:relative;padding:44px 20px 22px;color:var(--paper-ink);
  background:var(--grain-paper),radial-gradient(120% 90% at 50% 25%,#F1E7CA 0,#E5D7AF 68%,#CDBB88 100%);
  clip-path:polygon(0.5% 0.8%,6% 0%,14% 0.9%,23% 0.2%,33% 1%,44% 0.1%,55% 0.9%,66% 0.2%,77% 1%,88% 0.2%,95% 0.9%,100% 0.3%,99.2% 12%,100% 25%,99.3% 39%,100% 52%,99.1% 66%,100% 79%,99.4% 91%,100% 99.6%,94% 99%,85% 100%,74% 99.1%,63% 100%,52% 99%,41% 100%,30% 99.2%,19% 100%,9% 99%,0% 99.7%,0.8% 88%,0% 76%,0.9% 63%,0.1% 50%,0.8% 36%,0% 22%,0.7% 10%)}
.paper::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to bottom,transparent 41%,rgba(70,45,20,.13) 41.4%,rgba(255,255,255,.18) 42%,transparent 43%)}
.p-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-bottom:12px;border-bottom:2px dashed rgba(36,22,15,.32)}
.p-title{font:600 30px/1 var(--f-head);color:var(--paper-red)}
.p-art{font:400 13px var(--f-type);color:rgba(36,22,15,.7)}
.spec{display:grid;grid-template-columns:96px minmax(0,1fr)}
.spec dt,.spec dd{padding:12px 0;border-bottom:1.5px dashed rgba(36,22,15,.22)}
.spec dt{font:400 12px/1.5 var(--f-type);color:rgba(36,22,15,.62);padding-top:14px}
.spec dd{font-weight:500}
.spec > :nth-last-child(-n+2){border-bottom:0}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{min-width:34px;padding:2px 9px;border:1.5px solid var(--paper-ink);border-radius:3px;font:400 13px var(--f-type);text-align:center}
.chip:nth-child(odd){transform:rotate(-1.6deg)}
.chip:nth-child(even){transform:rotate(1.3deg)}
.sw{display:inline-flex;align-items:center;gap:7px;margin:0 14px 4px 0}
.sw i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--paper-ink)}
.p-foot{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:12px;padding-top:16px;border-top:2px dashed rgba(36,22,15,.32)}
.p-foot .bars{width:50%;height:36px;fill:var(--paper-ink)}
.stamp{width:92px;height:92px;flex:none;color:var(--paper-red);opacity:.82;transform:rotate(-14deg);margin:-6px 4px -6px 0}
.stamp text{font-family:var(--f-logo)}
.pinwrap.in .stamp{animation:stamp .5s cubic-bezier(.3,1.5,.5,1) 1.05s backwards}
@keyframes stamp{0%{opacity:0;transform:rotate(-34deg) scale(1.9)}100%{opacity:.82;transform:rotate(-14deg) scale(1)}}

.cta{position:sticky;bottom:0;padding:20px 18px calc(14px + var(--safe-b));background:linear-gradient(to top,#1a0e08 66%,transparent)}
.btn{display:block;width:100%;height:54px;border-radius:12px;background:var(--pumpkin);color:#1A0A12;
  font:600 17px/54px var(--f-text);text-align:center;box-shadow:0 8px 26px rgba(255,122,26,.32);transition:transform .15s var(--ease)}
.btn:active{transform:scale(.97)}

/* общий переход картинки: карточка <-> страница вещи */
::view-transition-group(art){animation-duration:.5s;animation-timing-function:var(--ease)}
::view-transition-old(art),::view-transition-new(art){height:100%;object-fit:cover}
::view-transition-old(root),::view-transition-new(root){animation-duration:.3s}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<main class="page home" id="home">
  <h1 class="logo" id="logo"></h1>
  <p class="sub" id="total"></p>
  <div class="rows" id="rows"></div>
</main>

<section class="page cat wood" id="cat">
  <div class="bar"><button class="back" data-act="back" aria-label="Назад"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
  <div class="cat-head" id="catHead"></div>
  <div class="grid" id="grid"></div>
</section>

<article class="page item wood" id="item"></article>

<script>
(() => {
'use strict';

/* =====================================================================
   НАСТРОЙКИ — меняйте здесь
   ===================================================================== */
const CONFIG = {
  logo: 'ohhwea',                 // надпись-логотип (главная и печать на паспорте)
  manager: 'zombi3boy',        // username менеджера в Telegram, без @
  delivery: '10–15 дней',          // срок доставки из Китая (показывается в паспорте)
  prefillArticle: false            // true: в чат менеджеру подставляется только артикул; false: чат открывается пустым
};

const CATEGORIES = [
  { id: 'jacket',      names: ['JACKET', 'BOMBER'] },
  { id: 'shoes',       names: ['SHOES'] },
  { id: 'accessories', names: ['ACCESSORIES'] },
  { id: 'hoodie',      names: ['HOODIE', 'CREWNECK', 'LONGSLEEVE'] },
  { id: 'pants',       names: ['SWEATPANTS', 'JEANS'] },
  { id: 'tshirts',     names: ['T SHIRTS'] }
];

/* Вещь = одна строка. Поле img (ссылка на фото) необязательно:
   пока его нет, показывается силуэт цвета первой расцветки.
   Данные ниже — ДЕМО, замените на свои.
   Поля weight, cny, source больше нигде не показываются: их можно удалять. */
const C = {
  black:['Чёрный','#1F1F24'], white:['Молочный','#E9E1CB'], olive:['Оливковый','#5B6340'],
  grey:['Серый','#8A9097'], navy:['Тёмно-синий','#1F2A44'], sand:['Песочный','#C9B79A'],
  blue:['Синий деним','#4A6285'], brown:['Коричневый','#5A4234']
};
const col = (...k) => k.map(x => ({ name: C[x][0], hex: C[x][1] }));
const CLO = ['S','M','L','XL','XXL'];
const SHO = ['40','41','42','43','44','45'];
const ONE = ['Единый'];

const ITEMS = [
  { id:'j1', cat:'jacket', name:'жопа', art:'JB-001', price:5900, material:'хуевый', sizes:CLO, colors:col('black','olive'), },
  { id:'j2', cat:'jacket', name:'девственность', art:'JB-002', price:6400, material:'качесвто говно', fit:'Прямой', sizes:CLO, colors:col('sand','navy'), },
  { id:'j3', cat:'jacket', name:'писюн', art:'JB-003', price:5300, material:'полиэстер', fit:'Свободный', sizes:CLO, colors:col('olive','black','grey'), },

  { id:'s1', cat:'shoes', name:'-', art:'SH-001', price:7200, material:'-', sizes:SHO, colors:col('white','black'), },
  { id:'s2', cat:'shoes', name:'-', art:'SH-002', price:6100, material:'-', sizes:SHO, colors:col('white'), },
  { id:'s3', cat:'shoes', name:'-', art:'SH-003', price:8300, material:'-', sizes:SHO, colors:col('brown','black'), },

  { id:'a1', cat:'accessories', name:'-', art:'AC-001', price:1500, material:'-', sizes:ONE, colors:col('black','sand','navy'), },
  { id:'a2', cat:'accessories', name:'-', art:'AC-002', price:1700, material:'-', sizes:ONE, colors:col('olive','black'), },
  { id:'a3', cat:'accessories', name:'-', art:'AC-003', price:1400, material:'-', sizes:ONE, colors:col('white','grey'), },

  { id:'h1', cat:'hoodie', name:'-', art:'HD-001', price:4800, material:'-', sizes:CLO, colors:col('grey','black','white'), },
  { id:'h2', cat:'hoodie', name:'-', art:'HD-002', price:4100, material:'-', sizes:CLO, colors:col('navy','grey'), },
  { id:'h3', cat:'hoodie', name:'-', art:'HD-003', price:2900, material:'-', sizes:CLO, colors:col('black','white'), },
  { id:'h4', cat:'hoodie', name:'-', art:'HD-004', price:5200, material:'-', sizes:CLO, colors:col('olive','sand'), },

  { id:'p1', cat:'pants', name:'-', art:'SP-001', price:3600, material:'-', sizes:CLO, colors:col('grey','black'), },
  { id:'p2', cat:'pants', name:'-', price:4700, material:'-', sizes:['28','30','32','34','36'], colors:col('blue','black'), },
  { id:'p3', cat:'pants', name:'-', art:'SP-003', price:4200, material:'-', sizes:CLO, colors:col('olive','sand'), },

  { id:'t1', cat:'tshirts', name:'-', art:'TS-001', price:2100, material:'-', sizes:CLO, colors:col('white','black','grey'), },
  { id:'t2', cat:'tshirts', name:'-', art:'TS-002', price:2500, material:'-', sizes:CLO, colors:col('black','sand'), },
  { id:'t3', cat:'tshirts', name:'-', art:'TS-003', price:1800, material:'-', sizes:CLO, colors:col('white','navy','olive'), }
];

/* =====================================================================
   Текстуры (рисуются один раз и кладутся в CSS-переменные)
   ===================================================================== */
function texture(w, h, freq, octaves, seed, matrix) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><filter id="f" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="${freq}" numOctaves="${octaves}" seed="${seed}" stitchTiles="stitch"/><feColorMatrix values="${matrix}"/></filter><rect width="100%" height="100%" filter="url(#f)"/></svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
}
const rootStyle = document.documentElement.style;
rootStyle.setProperty('--grain-wood',  texture(260, 520, '0.16 0.006', 3, 7, '0 0 0 0 0.05  0 0 0 0 0.02  0 0 0 0 0  0 0 0 1.5 -0.5'));
rootStyle.setProperty('--grain-paper', texture(220, 220, '0.7', 3, 3, '0 0 0 0 0.25  0 0 0 0 0.16  0 0 0 0 0.07  0 0 0 0.55 -0.12'));
rootStyle.setProperty('--grain-film',  texture(200, 200, '0.9', 2, 11, '0 0 0 0 0.94  0 0 0 0 0.9  0 0 0 0 0.8  0 0 0 0.12 0'));

/* паутина в углу главной */
function web() {
  const ang = [0, 18, 36, 54, 72, 90].map(d => d * Math.PI / 180);
  let d = '';
  ang.forEach(a => { d += `M0 0L${(150 * Math.cos(a)).toFixed(1)} ${(150 * Math.sin(a)).toFixed(1)}`; });
  [38, 74, 110, 146].forEach(r => {
    for (let i = 0; i < ang.length - 1; i++) {
      const a1 = ang[i], a2 = ang[i + 1], am = (a1 + a2) / 2;
      d += `M${(r * Math.cos(a1)).toFixed(1)} ${(r * Math.sin(a1)).toFixed(1)}` +
           `Q${(r * .8 * Math.cos(am)).toFixed(1)} ${(r * .8 * Math.sin(am)).toFixed(1)} ${(r * Math.cos(a2)).toFixed(1)} ${(r * Math.sin(a2)).toFixed(1)}`;
    }
  });
  return `<svg class="web" viewBox="0 0 150 150" aria-hidden="true"><path d="${d}" fill="none" stroke="#EFE6CC" stroke-width="1"/></svg>`;
}

/* =====================================================================
   Силуэты (пока нет фото)
   ===================================================================== */
const SIL = {
  jacket:{ m:'M31 20 L42 14 Q50 21 58 14 L69 20 L91 40 L85 68 L75 64 L75 86 L25 86 L25 64 L15 68 L9 40 Z',
           d:'M50 20 V86 M25 77 H75 M38 35 L50 25 L62 35 M12 58 L20 62 M88 58 L80 62' },
  shoes:{ m:'M6 64 L6 52 Q20 52 28 42 L38 46 Q52 54 68 52 Q90 52 95 66 L95 72 L6 72 Z',
          d:'M6 66 H95 M34 47 L40 41 M42 50 L48 44 M50 52 L56 46 M80 56 Q88 58 90 64' },
  accessories:{ m:'M18 62 Q18 28 50 26 Q82 28 82 62 Z M64 60 Q96 58 96 68 Q82 72 62 66 Z',
                d:'M50 26 Q44 44 46 62 M50 26 Q56 44 54 62 M18 62 H82' },
  hoodie:{ m:'M36 16 Q50 8 64 16 L88 34 L83 64 L73 60 L73 88 L27 88 L27 60 L17 64 L12 34 Z',
           d:'M38 16 Q50 34 62 16 M46 30 V46 M54 30 V46 M36 66 H64 L67 80 H33 Z' },
  pants:{ m:'M30 12 H70 L77 90 H56 L50 42 L44 90 H23 Z',
          d:'M30 20 H70 M46 20 V30 M54 20 V30 M23 82 H44 M56 82 H77' },
  tshirts:{ m:'M34 14 Q50 26 66 14 L91 28 L83 46 L73 41 L73 86 L27 86 L27 41 L17 46 L9 28 Z',
            d:'M36 15 Q50 30 64 15 M27 80 H73 M85 38 L78 42 M15 38 L22 42' }
};
const lum = h => { const n = parseInt(h.slice(1), 16); return .299 * (n >> 16) + .587 * ((n >> 8) & 255) + .114 * (n & 255); };
const sil = (cat, color) => {
  const dark = lum(color) < 90;
  const detail = dark ? 'rgba(239,230,204,.32)' : 'rgba(22,10,26,.45)';
  return `<svg viewBox="0 0 100 100" aria-hidden="true" focusable="false">` +
    `<path d="${SIL[cat].m}" fill="${color}" stroke="rgba(239,230,204,.72)" stroke-width="1.3" stroke-linejoin="round"/>` +
    `<path d="${SIL[cat].d}" fill="none" stroke="${detail}" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
};

/* =====================================================================
   Утилиты
   ===================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = new Intl.NumberFormat('ru-RU');
const rub = n => money.format(n) + ' ₽';
const plural = (n, a, b, c) => { const m = n % 100, d = n % 10; return m > 10 && m < 20 ? c : d === 1 ? a : d > 1 && d < 5 ? b : c; };
const CAT = Object.fromEntries(CATEGORIES.map(c => [c.id, c]));
const ITEM = Object.fromEntries(ITEMS.map(i => [i.id, i]));
const inCat = id => ITEMS.filter(i => i.cat === id);
const TILT = [-1.6, 1.1, -.7, 1.5, -1.2, .8, -.4, 1.3];
const art = (it, eager) => it.img
  ? `<img src="${esc(it.img)}" alt="" decoding="async"${eager ? '' : ' loading="lazy"'}>`
  : sil(it.cat, (it.colors && it.colors[0] ? it.colors[0].hex : C.black[1]));

function barcode(text) {
  const bits = '101' + [...text].map(c => c.charCodeAt(0).toString(2).padStart(8, '0')).join('') + '101';
  let x = 2, bars = '';
  for (const b of bits) { if (b === '1') bars += `<rect x="${x}" width="1.6" height="34"/>`; x += 2.2; }
  return `<svg class="bars" viewBox="0 0 ${x + 2} 34" preserveAspectRatio="none" aria-hidden="true">${bars}</svg>`;
}

const stamp = () =>
  `<svg class="stamp" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="3"/>` +
  `<circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="1"/>` +
  `<text x="50" y="59" text-anchor="middle" font-size="25" fill="currentColor">${esc(CONFIG.logo)}</text></svg>`;

/* =====================================================================
   Telegram
   ===================================================================== */
const tg = window.Telegram && window.Telegram.WebApp;
const inTG = !!(tg && tg.initData);
const hap = () => { try { tg.HapticFeedback.selectionChanged(); } catch (_) {} };
if (inTG) {
  document.documentElement.classList.add('tg');
  try { tg.ready(); tg.expand(); } catch (_) {}
  try { tg.setHeaderColor('#160A1A'); tg.setBackgroundColor('#160A1A'); } catch (_) {}
  try { tg.disableVerticalSwipes(); } catch (_) {}
  try { tg.BackButton.onClick(() => history.back()); } catch (_) {}
}
const syncBack = () => {
  if (!inTG) return;
  try {
    route.view === 'home' ? tg.BackButton.hide() : tg.BackButton.show();
    tg.setHeaderColor(route.view === 'home' ? '#160A1A' : '#25140D');
  } catch (_) {}
};

/* =====================================================================
   Рендер
   ===================================================================== */
const el = { home: $('#home'), cat: $('#cat'), item: $('#item'), grid: $('#grid'), head: $('#catHead') };
let route = { view: 'home' };
let renderedCat = null;

function buildHome() {
  const n = ITEMS.length;
  $('#logo').textContent = CONFIG.logo;
  $('#home').insertAdjacentHTML('afterbegin', web());
  $('#total').textContent = `${n} ${plural(n, 'вещь', 'вещи', 'вещей')} из Китая`;
  $('#rows').innerHTML = CATEGORIES.map(c => {
    const k = inCat(c.id).length;
    return `<button class="row" data-cat="${c.id}">
      <span><span class="row-name">${c.names.map(x => `<span>${esc(x)}</span>`).join('')}</span>
      <span class="row-count">${k ? `${k} ${plural(k, 'вещь', 'вещи', 'вещей')}` : 'Скоро'}</span></span>
      ${sil(c.id, '#2A1530')}</button>`;
  }).join('');
}

function buildCat(id) {
  const c = CAT[id], list = inCat(id);
  renderedCat = id;
  el.head.innerHTML =
    `<h2 class="cat-title">${c.names.map(x => `<span>${esc(x)}</span>`).join('')}</h2>` +
    `<p class="cat-count">${list.length ? `${list.length} ${plural(list.length, 'вещь', 'вещи', 'вещей')}` : ''}</p>`;
  el.grid.innerHTML = list.length
    ? list.map((it, i) => `<button class="card" data-id="${it.id}" style="--i:${Math.min(i, 8)};--r:${TILT[i % TILT.length]}deg">
        <span class="art">${art(it)}</span>
        <span class="meta"><span class="name">${esc(it.name)}</span><span class="price">${rub(it.price)}</span></span>
      </button>`).join('')
    : `<p class="empty">Здесь пока пусто. Новые вещи появятся позже.</p>`;
  el.cat.scrollTop = 0;
}

function buildItem(id) {
  const it = ITEM[id];
  const rows = [
    it.material && ['Материал', esc(it.material)],
    it.fit && ['Посадка', esc(it.fit)],
    it.sizes && it.sizes.length && ['Размеры', `<div class="chips">${it.sizes.map(s => `<span class="chip">${esc(s)}</span>`).join('')}</div>`],
    it.colors && it.colors.length && ['Цвета', it.colors.map(c => `<span class="sw"><i style="background:${c.hex}"></i>${esc(c.name)}</span>`).join('')],
    CONFIG.delivery && ['Доставка', esc(CONFIG.delivery)]
  ].filter(Boolean);
  el.item.innerHTML =
    `<div class="bar"><button class="back" data-act="back" aria-label="Назад"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>` +
    `<div class="art hero">${art(it, true)}</div>` +
    `<div class="i-head"><h2 class="i-name">${esc(it.name)}</h2><p class="i-price">${rub(it.price)}</p></div>` +
    `<div class="pinwrap" id="pinwrap"><i class="nail"></i>
      <div class="paper">
        <div class="p-head"><span class="p-title">Паспорт вещи</span><span class="p-art">${esc(it.art)}</span></div>
        <dl class="spec">${rows.map(r => `<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join('')}</dl>
        <div class="p-foot">${barcode(it.art)}${stamp()}</div>
      </div></div>` +
    `<div class="cta"><button class="btn" data-act="order">Заказать у менеджера</button></div>`;
  el.item.scrollTop = 0;
}

const settle = () => { const w = $('#pinwrap'); if (w) requestAnimationFrame(() => w.classList.add('in')); };

/* =====================================================================
   Навигация: #/  →  #/c/<категория>  →  #/i/<вещь>
   ===================================================================== */
function parse() {
  const p = location.hash.replace(/^#\/?/, '').split('/');
  if (p[0] === 'c' && CAT[p[1]]) return { view: 'cat', cat: p[1] };
  if (p[0] === 'i' && ITEM[p[1]]) return { view: 'item', id: p[1], cat: ITEM[p[1]].cat };
  return { view: 'home' };
}

const reduce = matchMedia('(prefers-reduced-motion: reduce)');

function render(first) {
  const next = parse(), prev = route;
  if (!first && next.view === prev.view && next.cat === prev.cat && next.id === prev.id) return;
  route = next;

  const apply = () => {
    if (next.cat && renderedCat !== next.cat) buildCat(next.cat);
    if (next.view === 'item') buildItem(next.id);
    el.cat.classList.toggle('open', next.view !== 'home');
    el.item.classList.toggle('open', next.view === 'item');
    el.home.classList.toggle('shift', next.view !== 'home');
    syncBack();
  };

  const toItem = next.view === 'item' && prev.view === 'cat';
  const fromItem = prev.view === 'item' && next.view === 'cat';

  if (!first && (toItem || fromItem) && document.startViewTransition && !reduce.matches) {
    const id = toItem ? next.id : prev.id;
    const cardArt = () => el.grid.querySelector(`[data-id="${CSS.escape(id)}"] .art`);
    const name = (node, on) => { if (node) node.style.viewTransitionName = on ? 'art' : ''; };
    name(toItem ? cardArt() : $('.hero'), true);
    el.item.classList.add('instant');
    const t = document.startViewTransition(() => {
      if (toItem) { name(cardArt(), false); apply(); name($('.hero'), true); }
      else        { name($('.hero'), false); apply(); name(cardArt(), true); }
    });
    t.finished.catch(() => {}).then(() => {
      name(cardArt(), false); name($('.hero'), false);
      el.item.classList.remove('instant');
      if (toItem) settle();
    });
    return;
  }

  apply();
  if (next.view === 'item') setTimeout(settle, 320);
}

function go(hash) { history.pushState(null, '', hash); render(); }

function startRoute() {
  let target = parse();
  const sp = inTG && tg.initDataUnsafe && tg.initDataUnsafe.start_param;   // t.me/бот/app?startapp=i-j1
  if (target.view === 'home' && sp) {
    if (sp.startsWith('i-') && ITEM[sp.slice(2)]) target = { view: 'item', id: sp.slice(2), cat: ITEM[sp.slice(2)].cat };
    else if (sp.startsWith('c-') && CAT[sp.slice(2)]) target = { view: 'cat', cat: sp.slice(2) };
  }
  // собираем историю, чтобы «Назад» всегда шёл вверх по уровням
  history.replaceState(null, '', '#/');
  if (target.view !== 'home') history.pushState(null, '', '#/c/' + target.cat);
  if (target.view === 'item') history.pushState(null, '', '#/i/' + target.id);
  render(true);
}

function order() {
  const it = ITEM[route.id]; if (!it) return;
  const text = CONFIG.prefillArticle ? '?text=' + encodeURIComponent(it.art) : '';
  const url = `https://t.me/${CONFIG.manager}${text}`;
  if (inTG && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, '_blank', 'noopener');
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-cat],[data-id],[data-act]');
  if (!t) return;
  const act = t.dataset.act;
  if (act === 'back') return history.back();
  if (act === 'order') { try { tg.HapticFeedback.impactOccurred('medium'); } catch (_) {} return order(); }
  hap();
  go(t.dataset.cat ? '#/c/' + t.dataset.cat : '#/i/' + t.dataset.id);
});
addEventListener('popstate', () => render());

buildHome();
startRoute();
})();
</script>
</body>
</html>
